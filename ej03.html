
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Tablas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5fa;
            padding: 30px;
        }

        h1 {
            color: #176b87;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #9aabb8;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #176b87;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eaf4f4;
        }
    </style>
</head>

<body>

    <h1>Países y sus capitales</h1>

    <table>
        <tr>
            <th>País</th>
            <th>Capital</th>
            <th>Continente</th>
        </tr>

        <tr>
            <td>Ecuador</td>
            <td>Quito</td>
            <td>América del Sur</td>
        </tr>

        <tr>
            <td>Japón</td>
            <td>Tokio</td>
            <td>Asia</td>
        </tr>
    </table>

    <p><a href="index.html">Volver al inicio</a></p>

</body>
</html>
