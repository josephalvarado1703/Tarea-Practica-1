
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5fa;
            margin: 0;
        }

        header {
            background-color: #10243a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        main {
            padding: 25px;
        }

        h2 {
            color: #176b87;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .galeria img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .galeria img:hover {
            transform: scale(1.03);
        }

        .ventana {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ventana:target {
            display: flex;
        }

        .ventana img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
        }

        .cerrar {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi galería de pasatiempos</h1>
        <p>Joseph William Alvarado Arias</p>
    </header>

    <main>
        <h2>Mis intereses</h2>
        <p>Haz clic en una imagen para verla ampliada.</p>

        <div class="galeria">

            <a href="#foto1">
                <img
                    src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=700&q=80"
                    alt="Videojuegos">
            </a>

            <a href="#foto2">
                <img
                    src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=700&q=80"
                    alt="Tecnología">
            </a>

            <a href="#foto3">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
                    alt="Viajes y naturaleza">
            </a>

        </div>
    </main>

    <div class="ventana" id="foto1">
        <a class="cerrar" href="#">×</a>
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1400&q=90" alt="Videojuegos ampliados">
    </div>

    <div class="ventana" id="foto2">
        <a class="cerrar" href="#">×</a>
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1400&q=90" alt="Tecnología ampliada">
    </div>

    <div class="ventana" id="foto3">
        <a class="cerrar" href="#">×</a>
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=90" alt="Viaje ampliado">
    </div>

    <p style="text-align:center">
        <a href="index.html">Volver al inicio</a>
    </p>

</body>
</html>
